[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"
  # Skip the build when the commit does not touch the site. The publication
  # Action commits backend/cache/ to main every hour; each of those used to be
  # a production deploy, and a production deploy is 15 of the free plan's 300
  # monthly credits (docs/DEPLOY.md).
  #
  # Netlify runs this with Bash from the base directory, so the pathspecs are
  # relative to frontend/: "." is the site, "../netlify.toml" is this file.
  # Exit 0 skips the build, anything else builds:
  #   - no CACHED_COMMIT_REF, or equal to COMMIT_REF (a build without cache,
  #     e.g. "Clear cache and deploy"): the first test fails -> exit 1 -> build.
  #     A bare git diff would compare a commit with itself and skip it.
  #   - git diff: 0 = nothing changed under those paths -> skip; 1 = changed ->
  #     build; 128 = the old commit is not in the clone -> build. Every doubt
  #     builds; only a provably unrelated commit is skipped.
  ignore = '[ -n "$CACHED_COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ../netlify.toml'

[build.environment]
  NEXT_PUBLIC_LIVE_URL = "https://pit-wall-f1-project-live.onrender.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"
