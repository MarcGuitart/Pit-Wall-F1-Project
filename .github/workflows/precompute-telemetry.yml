# Telemetry is the slow, expensive half of a new race: FastF1, up to two hours,
# and a separate set of cache files. It used to run on `push` to
# backend/cache/*/laps.json, which was fine while laps.json arrived by hand and
# became wrong the moment publishing was automated — the publication Action would
# have started a two-hour telemetry job inside its own commit, on a trigger that
# no longer even fires, since raw endpoints are no longer committed.
#
# So it has its own schedule. Once a day, after the publication runs have had all
# night to land, and dispatchable for anything that needs it sooner.

name: Precompute Telemetry Cache

on:
  schedule:
    # 04:40 UTC daily: a Sunday race is published within a couple of hours of the
    # flag, so by the small hours its laps are on disk and this has work to do.
    - cron: '40 4 * * *'
  workflow_dispatch:
    inputs:
      sessions:
        description: 'Session keys to compute (comma-separated, e.g. 9636,9539) or "all"'
        required: false
        default: 'all'
      drivers:
        description: 'Driver codes (comma-separated)'
        required: false
        default: 'VER,NOR,PIA,LEC,RUS,HAM,SAI,ALO,ANT,GAS,PER,OCO,STR,TSU'
      force:
        description: 'Recompute even if telemetry cache already exists'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Cache FastF1 data
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastf1
          key: fastf1-${{ github.run_id }}
          restore-keys: |
            fastf1-

      - name: Create FastF1 cache directory
        run: mkdir -p ~/.cache/fastf1

      - name: Run telemetry precomputation
        run: |
          cd backend
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/precompute_telemetry.py \
            --sessions "${{ github.event.inputs.sessions || 'all' }}" \
            --drivers "${{ github.event.inputs.drivers || 'VER,NOR,PIA,LEC,RUS,HAM,SAI,ALO,ANT,GAS,PER,OCO,STR,TSU' }}" \
            $FORCE_FLAG
        env:
          ENVIRONMENT: ci
          FASTF1_CACHE: ~/.cache/fastf1

      - name: Commit telemetry cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/cache/*/telemetry_*.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ci: precompute telemetry cache [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
