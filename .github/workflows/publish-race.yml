# Publish the analysis of a finished race, with nobody at a keyboard.
#
# Render declares no disk, so backend/cache/ is baked into the image: a commit
# here is the only way a new race reaches the site. That is also why the commit
# message carries [skip ci] and not [skip render]. [skip ci] stops GitHub Actions
# re-triggering on our own commit; Render does not recognise it at all, since it
# only honours [skip render] / [render skip] / [skip deploy] / [skip cd]. So the
# deploy we need still happens and the loop we do not want does not.
#
# The decisions are in backend/app/services/autopublish.py and are unit-tested.
# This file only schedules, commits and calls: every non-trivial step is a script
# that can be run from a laptop.

name: Publish finished race

on:
  schedule:
    # Hourly. Races finish at almost any hour on a global calendar, and a session
    # needs a second run to clear the lap-stability check, so hourly puts a fresh
    # race on the site within roughly two hours of the flag.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      session_keys:
        description: 'Session keys to consider (comma-separated). Empty = search the current season.'
        required: false
        default: ''
      dry_run:
        description: 'Decide and report, publish nothing'
        required: false
        default: 'false'
      backfill:
        description: 'Publish every ready session in one run and one commit. Needs session_keys.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write      # commit the analysis
  issues: write        # report a session that will not settle

concurrency:
  # Two runs pushing to main at once is the one way this corrupts itself.
  group: publish-race
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  publish:
    runs-on: ubuntu-latest
    # The hourly run publishes two races and finishes in minutes. A backfill
    # publishes a season: nineteen races at roughly a dozen rate-limited OpenF1
    # requests each, plus the analysis, and the 55/min limiter blocks rather
    # than drops. Six hours is generous on purpose — the job is run by hand,
    # rarely, and a backfill killed at 45 minutes wastes everything it computed.
    timeout-minutes: ${{ inputs.backfill && 360 || 45 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The previous run's lap counts. Deliberately not in the repo: committing
      # them would mean a production deploy on every run, for a file nothing
      # serves. A cache miss reads as "no previous observation", which delays a
      # publication by one run — the safe direction.
      - name: Restore the previous run's lap counts
        uses: actions/cache/restore@v4
        with:
          path: backend/.autopublish-state.json
          key: autopublish-state-${{ github.run_id }}
          restore-keys: autopublish-state-

      - name: Decide and compute
        id: run
        env:
          OPENF1_USERNAME: ${{ secrets.OPENF1_USERNAME }}
          OPENF1_PASSWORD: ${{ secrets.OPENF1_PASSWORD }}
          # Lets this build step through the PRO gate on /analysis without a
          # user token — it is computing a PRO-season race before anyone could
          # hold one. Never set on Render; only this Action needs it.
          INTERNAL_BUILD_SECRET: ${{ secrets.INTERNAL_BUILD_SECRET }}
          ENVIRONMENT: ci
          SESSION_KEYS: ${{ github.event.inputs.session_keys }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          ARGS=""
          [ -n "$SESSION_KEYS" ] && ARGS="$ARGS --session-keys $SESSION_KEYS"
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          if [ "$BACKFILL" = "true" ]; then
            if [ -z "$SESSION_KEYS" ]; then
              echo "::error::backfill needs session_keys — an unbounded automatic search is"
              echo "::error::the accident the per-run cap exists to prevent"
              exit 1
            fi
            ARGS="$ARGS --limit 0"
          fi
          set +e
          python scripts/autopublish.py --state-file .autopublish-state.json $ARGS 2>&1 | tee run.log
          set -e
          # The script's last line is REPORT:{json}; everything above it is log.
          grep '^REPORT:' run.log | tail -1 | cut -c8- > report.json
          if [ ! -s report.json ]; then
            echo "::error::the script produced no report"
            echo '{"published":[],"stuck":[],"errors":[{"error":"no report produced"}],"deferred":[]}' > report.json
          fi
          {
            echo "report<<REPORT_EOF"
            cat report.json
            echo ""
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Save this run's lap counts
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/.autopublish-state.json
          key: autopublish-state-${{ github.run_id }}

      # Only the computed output. The pipeline writes the raw endpoints into the
      # same directory, and .gitignore keeps them out: intervals.json alone is
      # 3.7 MB per race against 72 KB for the whole analysis, and the analysis is
      # all the site serves. Two independent guards, so neither alone has to hold
      # — this step names the two files, and the ignore rules make the rest
      # unstageable even by accident.
      - name: Commit the analyses
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only session_keys that actually published — never a blind glob.
          # A failed session is cleaned off disk by autopublish.py itself
          # (discard_incomplete_session), but this is the second, independent
          # guard: even if something slipped past that, a session absent from
          # report.json's "published" list is never staged here, so a partial
          # write can never become a commit on its own.
          python -c "
          import json
          report = json.load(open('report.json'))
          for p in report.get('published', []):
              if not p.get('dry_run'):
                  print(p['session_key'])
          " > published_keys.txt
          while read -r key; do
            git add "cache/$key/_analysis.json" "cache/$key/_session_meta.json"
          done < published_keys.txt
          rm -f published_keys.txt
          if git diff --staged --quiet; then
            echo "nothing to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --staged --stat
          # One commit, whether it carries two races or a season.
          python scripts/publish_commit_message.py report.json > commit-message.txt
          cat commit-message.txt
          git commit -F commit-message.txt
          rm -f commit-message.txt
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" \
              && git push origin "HEAD:${{ github.ref_name }}" && break
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Open an issue for a session that will not settle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.run.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/autopublish_issue.py

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT: ${{ steps.run.outputs.report }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/issues
        run: python scripts/notify_telegram.py
